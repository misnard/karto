# Alternative to the Caddyfile when nginx already serves the VPS: /etc/nginx/sites-available/karto.example.fr,
# linked into sites-enabled. Check with `sudo nginx -t`, then `sudo systemctl reload nginx`.
# HTTPS: `sudo certbot --nginx -d karto.example.fr --redirect` once the DNS record points here. Certbot adds the
# 443 listener and the certificate, and its timer renews it.
server {
    listen 80;
    listen [::]:80;
    server_name karto.example.fr;
    client_max_body_size 5m;  # the API refuses bodies over 5 MiB too

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
