            "recipeYield": "8 personnes",
            "recipeIngredient": [
                "1 paquet de lasagnes",
                "3 oignons jaunes",
                "2 gousses d'ail",
                "1 branche de c\u00e9leri",
                "1 carotte",
                "600 g de boeuf hach\u00e9",
                "800 g de pur\u00e9e de tomate",
                "15 cl d'eau",
                "20 cl de vin rouge",
                "2 feuilles de laurier",
                "thym",
                "basilic",
                "3 pinc\u00e9es de muscade r\u00e2p\u00e9e",
                "70 g de fromage r\u00e2p\u00e9",
                "125 g de parmesan",
                "sel",
                "poivre",
                "100 g de farine",
                "125 g de beurre",
                "1 l de lait"
            ],
            "recipeInstructions": [
                {
                    "@type": "HowToStep",
                    "text": "Faire revenir gousses hach\u00e9es d'ail et les oignons \u00e9minc\u00e9s dans un peu d'huile d'olive."
                },
                {
                    "@type": "HowToStep",
                    "text": "Ajouter la carotte et la branche de c\u00e9leri hach\u00e9e puis la viande et faire revenir le tout."
                },
                {
                    "@type": "HowToStep",
                    "text": "Au bout de quelques minutes, ajouter le vin rouge. Laisser cuire jusqu'\u00e0 \u00e9vaporation."
                },
                {
                    "@type": "HowToStep",
                    "text": "Ajouter la pur\u00e9e de tomates, l'eau et les herbes.\nSaler, poivrer, puis laisser mijoter \u00e0 feu doux 45 minutes."
                },
                {
                    "@type": "HowToStep",
                    "text": "Pr\u00e9parer la b\u00e9chamel : faire fondre 100 g de beurre."
                },
                {
                    "@type": "HowToStep",
                    "text": "Hors du feu, ajouter la farine d'un coup."
                },
                {
                    "@type": "HowToStep",
                    "text": "Remettre sur le feu et remuer avec un fouet jusqu'\u00e0 l'obtention d'un m\u00e9lange bien lisse. "
                },
                {
                    "@type": "HowToStep",
                    "text": "Ajouter le lait peu \u00e0 peu."
                },
                {
                    "@type": "HowToStep",
                    "text": "Remuer sans cesse, jusqu'\u00e0 ce que le m\u00e9lange s'\u00e9paississe."
                },
                {
                    "@type": "HowToStep",
                    "text": "Ensuite, parfumer avec la muscade, saler, poivrer. Laisser cuire environ 5 minutes, \u00e0 feu tr\u00e8s doux, en remuant. R\u00e9server."
                },
                {
                    "@type": "HowToStep",
                    "text": "Pr\u00e9chauffer le four \u00e0 200\u00b0C (thermostat 6-7).\nHuiler le plat \u00e0 lasagnes. Poser une fine couche de b\u00e9chamel puis des feuilles de lasagnes, de la bolognaise, de la b\u00e9chamel et du parmesan.\nR\u00e9p\u00e9ter l'op\u00e9ration 3 fois de suite."
                },
                {
                    "@type": "HowToStep",
                    "text": "Sur la derni\u00e8re couche de lasagnes, ne mettre que de la b\u00e9chamel et recouvrir de fromage r\u00e2p\u00e9. Parsemer quelques noisettes de beurre."
                },
                {
                    "@type": "HowToStep",
                    "text": "Enfourner pour environ 25 minutes de cuisson."
                },
                {
                    "@type": "HowToStep",
                    "text": "D\u00e9guster"
                }
            ],
